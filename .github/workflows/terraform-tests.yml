name: Terraform Tests

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '**.tf'
      - '**.tftest.hcl'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform-tests.yml'
  pull_request:
    paths:
      - '**.tf'
      - '**.tftest.hcl'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform-tests.yml'

# Cancel earlier runs on the same branch/PR when a new commit arrives.
concurrency:
  group: terraform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # fmt + validate + test (native terraform test framework, no AWS creds needed)
  # ---------------------------------------------------------------------------
  test:
    name: fmt + validate + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false

      - name: Cache providers and modules
        uses: actions/cache@v5
        with:
          path: .terraform
          key: ${{ runner.os }}-tf-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend — tests use mocks, no AWS creds needed)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Test
        run: terraform test -no-color

  # ---------------------------------------------------------------------------
  # tflint — static analysis with the AWS ruleset
  # ---------------------------------------------------------------------------
  tflint:
    name: tflint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.55.0

      - name: Cache tflint plugins
        uses: actions/cache@v5
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-

      - name: Init tflint
        run: tflint --init

      - name: Run tflint (root)
        run: tflint --format=default --no-color

      - name: Run tflint (modules)
        run: |
          for dir in modules/*/; do
            echo "── tflint: $dir"
            tflint --format=default --no-color --chdir="$dir"
          done

  # ---------------------------------------------------------------------------
  # checkov — Terraform security and compliance scanning
  # ---------------------------------------------------------------------------
  checkov:
    name: checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          soft_fail: false
          output_format: cli
          output_file_path: console
